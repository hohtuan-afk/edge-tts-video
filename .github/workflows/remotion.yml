name: Remotion render

on:
  push:
    branches: [main]
    paths: ["remotion/**", ".github/workflows/remotion.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Remotion
        run: |
          V=$(npm view remotion version)
          echo "Remotion $V"
          npm install --no-audit --no-fund remotion@$V @remotion/bundler@$V @remotion/renderer@$V \
            @remotion/google-fonts@$V @remotion/three@$V three@0.169.0 @react-three/fiber@8.17.10 \
            @remotion/paths@$V @remotion/transitions@$V @remotion/noise@$V roughjs react@18.3.1 react-dom@18.3.1
      - name: Render (mode in render-mode.txt)
        run: |
          MODE=$(cat render-mode.txt 2>/dev/null || echo stills)
          echo "mode=$MODE"
          mkdir -p out
          set -o pipefail
          node render.mjs "$MODE" 2>&1 | tee out/render-log.txt
      - name: Publish output to branch 'renders'
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b renders
          git add -A
          git commit -q -m "Remotion output (${{ github.sha }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders
