name: Edge TTS

on:
  push:
    branches: [main]
    paths: ["tts/**", ".github/workflows/tts.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python tts/make_audio.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Add Edge TTS audio [skip ci]" || echo "no changes"
          git push
